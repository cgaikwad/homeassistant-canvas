name: "Canvas Dashboard"
version: "1.1.0"
slug: "canvas_dashboard"
description: "Pulls Canvas LMS courses, grades, and assignment status for an observed student (parent Observer account) and exposes them as sensors + a dashboard panel"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:school
panel_title: Canvas
homeassistant_api: true
options:
  canvas_domain: "smsd.instructure.com"
  canvas_token: ""
  observee_id: 0
  poll_interval_minutes: 30
  token_expires_at: ""
schema:
  canvas_domain: str
  canvas_token: password
  observee_id: int
  poll_interval_minutes: int(5,1440)
  token_expires_at: str?
